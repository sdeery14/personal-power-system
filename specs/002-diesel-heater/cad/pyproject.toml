[project]
name = "diesel-heater-cad"
version = "0.1.0"
description = "PRELIMINARY parametric placeholder model of the Diesel Heater Module (002) frame. NOT FOR FABRICATION."
requires-python = ">=3.12,<3.13"
dependencies = ["cadquery==2.8.0"]

[dependency-groups]
dev = ["pytest>=8"]
# Interactive display in the VS Code OCP CAD Viewer extension (preview.py only).
# build.py, the exporters, and the tests do not import it.
viewer = ["ocp-vscode>=4.2,<5"]

[tool.uv]
default-groups = ["dev", "viewer"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
